# RotaVerde MS dual light/dark theme (based on shadcn-dual)

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "26px", "20px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true
paddingTop = "2.5rem"
paddingBottom = "2.5rem"

[theme.light]
primaryColor = "#15803D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#15803D"
borderColor = "#E2E8F0"
codeTextColor = "#14532D"
grayColor = "#64748B"
blueColor = "#2563EB"
greenColor = "#15803D"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
chartCategoricalColors = ["#15803D", "#2563EB", "#EA580C", "#7C3AED", "#0D9488", "#CA8A04", "#64748B"]
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"

[theme.dark]
primaryColor = "#16A34A"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
codeBackgroundColor = "#27272A"
textColor = "#FAFAFA"
linkColor = "#4ADE80"
borderColor = "#27272A"
codeTextColor = "#86EFAC"
grayColor = "#A1A1AA"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
chartCategoricalColors = ["#4ADE80", "#60A5FA", "#FB923C", "#A78BFA", "#2DD4BF", "#FACC15", "#A1A1AA"]
dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#18181B"
dataframeHeaderTextColor = "#FAFAFA"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#15803D"
linkColor = "#15803D"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeBorderColor = "#E2E8F0"

[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#18181B"
codeBackgroundColor = "#27272A"
textColor = "#FAFAFA"
borderColor = "#27272A"
primaryColor = "#16A34A"
linkColor = "#4ADE80"
dataframeHeaderBackgroundColor = "#18181B"
dataframeBorderColor = "#27272A"
